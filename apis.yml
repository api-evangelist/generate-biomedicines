aid: generate-biomedicines
name: Generate Biomedicines
description: >-
  Generate Biomedicines is a Somerville, Massachusetts therapeutics company
  pioneering Generative Biology, a machine-learning-driven approach to de novo
  protein design across antibodies, peptides, enzymes, and gene therapies.
  Founded out of Flagship Pioneering and chaired by Noubar Afeyan, the company
  trains generative models on the full compendium of natural protein structures
  and sequences plus proprietary wet-lab data to design novel protein
  therapeutics computationally rather than by trial-and-error discovery. Its
  open-source flagship is Chroma, a programmable diffusion-based generative
  model for joint protein structure and sequence design published in Nature 2023
  ("Illuminating protein space with a programmable generative model",
  doi:10.1038/s41586-023-06728-8) and released on GitHub under Apache 2.0 with
  pretrained weights available under a custom Chroma Parameters License (free
  for academic and nonprofit use). Chroma uses equivariant graph neural
  networks, diffusion modeling, and conditional random fields to sample
  all-atom protein structures with sub-quadratic complexity, supporting
  conditional generation via composable Conditioner modules for symmetry,
  substructure, shape, and secondary-structure constraints. The internal
  Generate Platform iterates on a "generate, build, measure, learn" loop that
  pairs in-silico design with high-throughput protein synthesis and
  characterization; the company reports having generated, built, and tested
  more than 42,000 proteins. Generate Biomedicines has platform collaborations
  with Amgen (six programs, January 2022) and Novartis (multiple programs,
  September 2024) and a CAR T collaboration with Roswell Park. Its clinical
  pipeline is led by GB-0895, a long-acting anti-TSLP antibody for severe
  asthma now in Phase 3 (SOLAIRIA study) with a parallel Phase 1 in COPD, plus
  preclinical programs GB-4362 (anti-free-MMAE for ADC oncology safety) and
  GB-5267 (MUC16 armored CAR T for ovarian cancer). The company priced its
  initial public offering in February 2026. Revenue derives from drug
  development, partner collaborations, and (for Chroma) commercial weights
  licensing; there is no public developer REST/HTTPS API or SDK for the
  Generate Platform itself — Chroma is consumed as a Python library installed
  via pip with model weights downloaded from chroma-weights.generatebiomedicines.com
  after registering for an API key.
